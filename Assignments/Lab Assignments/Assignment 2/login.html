<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | StudentHub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header"><a class="brand" href="index.html">Student<span>Hub</span></a>
        <nav aria-label="Primary navigation"><a href="marksheet.html">Marksheet</a><a href="resume.html">Resume</a><a
                href="menu.html">Menu</a><a href="registration.html">Register</a><a href="login.html">Login</a></nav>
    </header>
    <main class="page-shell form-wrap">
        <div class="form-card">
            <p class="eyebrow">Assignment 05</p>
            <h1>Welcome <em>back.</em></h1>
            <p>Sign in to continue to your StudentHub account.</p>
            <form action="#" method="post">
                <div class="field"><label for="login-email">Email address</label><input id="login-email" name="email"
                        type="email" autocomplete="email" required></div>
                <div class="field"><label for="login-password">Password</label><input id="login-password"
                        name="password" type="password" autocomplete="current-password" required></div><button
                    class="button" type="submit">Sign in</button>
            </form>
            <p class="form-note">New to StudentHub? <a href="registration.html">Create an account</a></p>
        </div>
    </main>
</body>

</html>
